<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Me - Grid Layout</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Vue JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="text-center py-4 bg-light">
    <h1>ABOUT ME</h1>
    <p class="text-muted">Personal Profile Dashboard</p>
  </header>

  <!-- Grid Layout -->
  <main class="grid-container">

    <!-- Top Row -->
    <div class="grid-item top-left">About</div>
    <div class="grid-item top-center">Education</div>
    <div class="grid-item top-right">Hobbies</div>

    <!-- Middle Row -->
    <div class="grid-item middle-left">Skills</div>

    <!-- Center: Profile Picture -->
    <div class="grid-item center">
      <img src="https://www.w3schools.com/bootstrap5/img_avatar1.png" alt="Profile Picture">
      <h5>Leonard Delos Reyes</h5>
    </div>

    <div class="grid-item middle-right">Goals</div>

    <!-- Bottom Row -->
    <div class="grid-item bottom-left">Vue</div>
    <div class="grid-item bottom-center" id="app">
      {{ message }}
    </div>
    <div class="grid-item bottom-right">Resources</div>

    <!-- Optional Empty Corner -->
    <div class="grid-item empty">Empty</div>

  </main>

  <footer class="text-center py-3 bg-light">
    <small>© 2026 Personal Profile Website</small>
  </footer>

  <!-- Vue JS -->
  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
