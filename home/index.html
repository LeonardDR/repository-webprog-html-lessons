<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personalized Profile Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/Style.css">
  <link rel="stylesheet" href="css/Flexboxgrid.css">
  <link rel="stylesheet" href="css/Image.css">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

<h1 style="text-align:center; margin-top:20px;">ABOUT ME</h1>

<div class="container">

  <header style="text-align:center; padding:20px;">
    <h2>Personal Profile Web Page</h2>
  </header>

  <main>

    <section class="main-content grid-layout">

      <!-- ROW 1 -->
      <div class="box about">About</div>
      <div class="box education">Education</div>
      <div class="box hobbies">Hobbies</div>

      <!-- ROW 2 -->
      <div class="box skills">Skills</div>

      <div class="box profile center-box">
        <img
          src="https://www.w3schools.com/bootstrap5/img_avatar1.png"
          alt="Profile Picture"
        >
        <p>Leonard Delos Reyes</p>
      </div>

      <div class="box goals">Goals</div>

      <!-- ROW 3 -->
      <div class="box vue">
        <div id="app">{{ message }}</div>
      </div>

      <div class="box resources">Resources</div>
      <div class="box empty">Empty</div>

    </section>

  </main>

</div>

<!-- Vue CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<!-- Your JavaScript files -->
<script src="js/vue.js"></script>
<script src="js/image.js"></script>

<!-- Bootstrap JS -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
