<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonard | Personal Profile Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Style.css">
    <link rel="stylesheet" href="css/Flexboxgrid.css">
    <link rel="stylesheet" href="css/Image.css">
</head>
<body>

<header class="text-center py-4">
    <h1 class="display-5 fw-bold">ABOUT ME</h1>
</header>

<div class="container grid-wrapper">
    <div class="grid-box clickable" data-info="I am an IT student at Asia Pacific College, passionate about web development.">
        <h3>About</h3>
    </div>
    <div class="grid-box clickable" data-info="Studying at APC. High School at Pasay City South High School.">
        <h3>Education</h3>
    </div>
    <div class="grid-box clickable" data-info="I love playing online games, watching anime, and reading manga.">
        <h3>Hobbies</h3>
    </div>

    <div class="grid-box clickable" data-info="Experienced in Python, Java, Dart, and MySQL.">
        <h3>Skills</h3>
    </div>
    
    <div class="profile-center-box">
        <div class="profile-card">
            <img src="https://www.w3schools.com/bootstrap5/img_avatar1.png" alt="Leonard's Profile">
            <h4 id="profile-name">Leonard</h4>
            <p id="profile-status">IT Student</p>
        </div>
    </div>

    <div class="grid-box clickable" data-info="My goal is to become a Full-Stack Developer and master Mobile App Dev.">
        <h3>Goals</h3>
    </div>

    <div class="grid-box clickable" data-info="Currently exploring Vue.js for modern reactive web interfaces.">
        <h3>Vue</h3>
    </div>
    <div class="grid-box resource-box">
        <h3>Resources</h3>
        <small>
            <a href="https://www.w3schools.com" target="_blank">W3Schools</a><br>
            <a href="https://github.com" target="_blank">GitHub</a>
        </small>
    </div>
    <div class="grid-box empty-box">
        <h3>Empty</h3>
        <p>Stay Tuned</p>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
